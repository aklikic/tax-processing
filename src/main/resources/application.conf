tax-processing {
    opening-balance-batch-size = 5000
    position-init-batch-size = 500
    transaction-microbatch-size = 111
    transaction-window-size = 320
    max-parallel-sub-workflows = 45
    completion-window = 5
    emergency-threshold = 10
    position-idempotency-cache-size = 1000

    database {
        # Set to true to use PostgreSQL database, false to use mock repository
        enable = true

        host = "localhost"
        port = 5432
        database = "TaxProcessing"
        username = "taxuser"
        password = "TaxProcessing123!"

        pool {
            initial-size = 5
            max-size = 20
            max-idle-time = "5 minutes"
            max-lifetime = "30 minutes"
            max-acquire-time = "30 seconds"
            max-create-connection-time = "30 seconds"
        }
    }
}