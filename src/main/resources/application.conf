tax-processing {
 #   positions-per-window = 5000
 #   position-init-batch-size = 500
 #   positions-per-batch = 1000
 #   transaction-window-size = 320
 #   position-idempotency-cache-size = 1000
 #   max-parallel-windows = 1

    positions-per-window = 500
    positions-per-window = ${?POSITION_NUMBER_PER_WINDOWS}
    max-parallel-windows = 6
    max-parallel-windows = ${?POSITION_MAX_WINDOWS}
    position-idempotency-cache-size = 10
    position-idempotency-cache-size = ${?POSITION_IDEMPOTENCY_CACHE_SIZE}
    transactions-microbatch-limit = 200
    transactions-microbatch-limit = ${?TRANSACTION_BATCH_LIMIT}
    transactions-batch-parallelism = 25
    transactions-batch-parallelism = ${?TRANSACTION_BATCH_PARALLELISM}

    position-init-batch-size = 100
    positions-per-batch = 10
    transaction-window-size = 100




    transactions-per-window = 100000


    database {
        # Set to true to use PostgreSQL database, false to use mock repository
        enable = true

        host = "localhost"
        host = ${?TAX_DB_HOST}
        port = 5432
        database = "postgres"
        username = "postgres"
        # password = "postgres"
        password = ${?TAX_DB_PASSWORD}



        ssl-enabled = true

        monitoring-delay = 10
        monitoring-delay = ${?TAX_DB_MONITORING_DELAY}
        pool {
            initial-size = 6
            initial-size = ${?TAX_DB_POOL_INIT_SIZE}
            max-size = 10                           # Reduced to stay within PostgreSQL limits
            max-size = ${?TAX_DB_POOL_MAX_SIZE}      # Reduced to stay within PostgreSQL limits
            max-idle-time = "10 minutes"             # Longer idle time for large processing
            max-lifetime = "60 minutes"              # Longer lifetime for long-running batches
            max-acquire-time = "60 seconds"          # Increased timeout for connection acquisition
            max-create-connection-time = "60 seconds" # Increased timeout for connection creation
        }
    }
}