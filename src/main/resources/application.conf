tax-processing {
    positions-per-window = 5000
    position-init-batch-size = 500
    positions-per-batch = 1000
    transaction-window-size = 320
    position-idempotency-cache-size = 1000
    max-parallel-windows = 2

    database {
        # Set to true to use PostgreSQL database, false to use mock repository
        enable = true

        host = "localhost"
        port = 5432
        database = "postgres"
        username = "postgres"
        password = "postgres"

        monitoring-delay = 10
        pool {
            initial-size = 20
            max-size = 20                           # Reduced to stay within PostgreSQL limits
            max-idle-time = "10 minutes"             # Longer idle time for large processing
            max-lifetime = "60 minutes"              # Longer lifetime for long-running batches
            max-acquire-time = "60 seconds"          # Increased timeout for connection acquisition
            max-create-connection-time = "60 seconds" # Increased timeout for connection creation
        }
    }
}