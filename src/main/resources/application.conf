tax-processing {
    position-number-per-window = 10
    position-number-per-window = ${?POSITION_NUMBER_PER_WINDOWS}
    position-max-parallel-windows = 2
    position-max-parallel-windows = ${?POSITION_MAX_WINDOWS}

    position-idempotency-cache-size = 10
    position-idempotency-cache-size = ${?POSITION_IDEMPOTENCY_CACHE_SIZE}

    position-max-completed-windows-to-keep-in-state = 20
    position-max-completed-windows-to-keep-in-state = ${?POSITION_MAX_COMPLETED_WINDOWS_TO_KEEP_IN_STATE}

    transactions-batch-limit = 200
    transactions-batch-limit = ${?TRANSACTION_BATCH_LIMIT}
    transactions-batch-parallelism = 25
    transactions-batch-parallelism = ${?TRANSACTION_BATCH_PARALLELISM}

    transactions-batch-running-timeout = 5 minutes
    transactions-batch-running-timeout = ${?TRANSACTION_BATCH_RUNNING_TIMEOUT}


    database {
        # Set to true to use PostgreSQL database, false to use mock repository
        enable = true

        host = "localhost"
        host = ${?TAX_DB_HOST}
        port = 5432
        database = "postgres"
        username = "postgres"
        password = "postgres"
        password = ${?TAX_DB_PASSWORD}



        ssl-enabled = false
        ssl-enabled = ${?TAX_DB_SSL}

        monitoring-delay = 10 seconds
        monitoring-delay = ${?TAX_DB_MONITORING_DELAY}
        pool {
            initial-size = 20
            initial-size = ${?TAX_DB_POOL_INIT_SIZE}
            max-size = 30                          # Reduced to stay within PostgreSQL limits
            max-size = ${?TAX_DB_POOL_MAX_SIZE}      # Reduced to stay within PostgreSQL limits
            max-idle-time = "10 minutes"             # Longer idle time for large processing
            max-lifetime = "60 minutes"              # Longer lifetime for long-running batches
            max-acquire-time = "60 seconds"          # Increased timeout for connection acquisition
            max-create-connection-time = "60 seconds" # Increased timeout for connection creation
        }
    }
}