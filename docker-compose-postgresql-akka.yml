services:
  postgres-db:
    image: postgres:18
    container_name: akka-postgresql
    hostname: akka-postgresql
    ports:
      - 5532:5532
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: [
      "postgres",
      "-c", "max_connections=200",              # Increased from default 100
      "-c", "shared_buffers=256MB",             # Increased for better performance
      "-c", "effective_cache_size=1GB",         # Better query planning
      "-c", "work_mem=64MB",                    # For large sorts/joins
      "-c", "maintenance_work_mem=256MB",       # For bulk operations
      "-c", "checkpoint_completion_target=0.9", # Better checkpoint performance
      "-c", "wal_buffers=16MB",                 # Better write performance
      "-c", "default_statistics_target=100",    # Better query planning
      "-c", "random_page_cost=1.1",             # SSD optimization
      "-c", "effective_io_concurrency=200"      # SSD optimization
    ]
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      interval: 5s
      retries: 5
      start_period: 5s
      timeout: 5s