<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tax Workflow Animation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            width: 900px;
        }

        #frame {
            font-family: monospace;
            font-size: 16px;
            white-space: pre;
            text-align: left;
            margin-top: 20px;
            background: #000;
            color: #00ff9c;
            padding: 20px;
            border-radius: 12px;
            min-height: 420px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Tax Processing Workflow Animation</h1>
    <div id="frame"></div>
</div>

<script>
    const frames = [
        `┌────────────────────────────────────────────────────────────┐
│ TAX PROCESSING SYSTEM                                      │
│                                                            │
│ 📊 Input: 4.4M Opening Balances + 12.3M Transactions        │
│ 🎯 Target: 4,823 TPS                                        │
│                                                            │
│ [START]                                                     │
└────────────────────────────────────────────────────────────┘`,

        `┌────────────────────────────────────────────────────────────┐
│ MAIN WORKFLOW                                               │
│                                                            │
│ Loading Window: 1 / 880                                     │
│                                                            │
│ [=====               ]                                      │
└────────────────────────────────────────────────────────────┘`,

        `┌────────────────────────────────────────────────────────────┐
│ POSITION INITIALIZATION                                    │
│                                                            │
│ Batch 1: ■■■■■                                              │
│ Batch 2: ■■■■■                                              │
│ Batch 3: ■■■■■                                              │
│ Batch 4: ■■■■■                                              │
│ Batch 5: ■■■■■                                              │
└────────────────────────────────────────────────────────────┘`,

        `┌────────────────────────────────────────────────────────────┐
│ PARALLEL PROCESSING                                        │
│                                                            │
│ Sub-1   ⚡⚡⚡                                               │
│ Sub-2   ⚡⚡⚡                                               │
│ Sub-3   ⚡⚡⚡                                               │
│ Sub-4   ⚡⚡⚡                                               │
│ Sub-5   ⚡⚡⚡                                               │
└────────────────────────────────────────────────────────────┘`,

        `┌────────────────────────────────────────────────────────────┐
│ CALLBACK COORDINATION                                      │
│                                                            │
│ Completed: 23 / 45                                         │
│ ███████████░░░░░░░░░░░░░░░                                 │
└────────────────────────────────────────────────────────────┘`,

        `┌────────────────────────────────────────────────────────────┐
│ WINDOW COMPLETE                                            │
│                                                            │
│ Moving to window 2 / 880                                   │
│                                                            │
│ [===========        ]                                      │
└────────────────────────────────────────────────────────────┘`,

        `┌────────────────────────────────────────────────────────────┐
│ PROGRESS: 50%                                              │
│                                                            │
│ Windows: 440 / 880                                         │
│ Throughput: 4,823 TPS                                      │
└────────────────────────────────────────────────────────────┘`,

        `┌────────────────────────────────────────────────────────────┐
│ ✅ PROCESS COMPLETE                                        │
│                                                            │
│ Total Windows: 880                                         │
│ Total Transactions: 12.3M                                  │
│ Status: COMPLETED 🏆                                       │
└────────────────────────────────────────────────────────────┘`
    ];

    let i = 0;
    const frameEl = document.getElementById("frame");

    function play() {
        frameEl.textContent = frames[i];
        i = (i + 1) % frames.length;
    }

    play();
    setInterval(play, 1500);
</script>
</body>
</html>
