version: '3.8'

services:
  sqlserver-edge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: tax-processing-sqlserver-edge
    hostname: sqlserver-edge
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: TaxProcessing123!
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_edge_data:/var/opt/mssql
      - ./mssql/init:/docker-entrypoint-initdb.d
      - ./mssql:/sql
    networks:
      - tax-processing-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P TaxProcessing123! -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  sqlserver_edge_data:
    driver: local

networks:
  tax-processing-network:
    driver: bridge