version: '3.8'

services:
  postgresql:
    image: postgres:18
    container_name: tax-processing-postgresql
    environment:
      #      POSTGRES_DB: TaxProcessing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    #      POSTGRES_USER: taxuser
    #      POSTGRES_PASSWORD: TaxProcessing123!
    #      PGDATA: /var/lib/postgresql/data/pgdata
    command: [
      "postgres",
      "-c", "max_connections=200",              # Increased from default 100
      "-c", "shared_buffers=256MB",             # Increased for better performance
      "-c", "effective_cache_size=1GB",         # Better query planning
      "-c", "work_mem=64MB",                    # For large sorts/joins
      "-c", "maintenance_work_mem=256MB",       # For bulk operations
      "-c", "checkpoint_completion_target=0.9", # Better checkpoint performance
      "-c", "wal_buffers=16MB",                 # Better write performance
      "-c", "default_statistics_target=100",    # Better query planning
      "-c", "random_page_cost=1.1",             # SSD optimization
      "-c", "effective_io_concurrency=200"      # SSD optimization
    ]
    ports:
      - "5432:5432"
    #    volumes:
    #      - postgresql_data:/var/lib/postgresql/data
    networks:
      - tax-processing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

#volumes:
#  postgresql_data:
#    driver: local

networks:
  tax-processing-network:
    driver: bridge